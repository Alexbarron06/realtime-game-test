<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juego Realtime</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2a;--line:#223b53;--text:#eef6ff;--muted:#8ea6bd;--accent:#28c2ff;--ok:#38d996}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#10263e 0,var(--bg) 48%);color:var(--text)}
.app{width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.card{border:1px solid var(--line);background:rgba(13,27,42,.94);border-radius:20px;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.badge{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#6f8294}.online .dot{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.arena{position:relative;width:100%;aspect-ratio:16/10;min-height:360px;overflow:hidden;border-radius:16px;border:1px solid #294560;background:linear-gradient(rgba(40,194,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(40,194,255,.08) 1px,transparent 1px),#081727;background-size:40px 40px}
.player{position:absolute;left:50%;top:50%;width:56px;height:56px;transform:translate(-50%,-50%);border-radius:14px;background:linear-gradient(145deg,#7be1ff,var(--accent));box-shadow:0 0 26px rgba(40,194,255,.35);transition:left .055s linear,top .055s linear}.player:after{content:"";position:absolute;inset:16px;border-radius:7px;background:#06243a}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;background:rgba(4,12,20,.68);backdrop-filter:blur(4px)}.hidden{display:none}.overlay strong{display:block;font-size:2rem;margin-bottom:8px}.overlay span{color:var(--muted)}
.row{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#0a1725;margin-bottom:10px}.label{display:block;color:var(--muted);font-size:.77rem;margin-bottom:4px}.value{font-weight:700;overflow-wrap:anywhere}.timer{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}a{color:var(--accent);overflow-wrap:anywhere;font-size:.86rem}
@media(max-width:800px){.app{grid-template-columns:1fr}.arena{min-height:300px}}
</style>
</head>
<body>
<main class="app">
<section class="card">
<div class="top"><h1>Juego Realtime</h1><div id="status" class="badge"><span class="dot"></span><span>Conectando…</span></div></div>
<div class="arena"><div id="player" class="player"></div>
<div id="waiting" class="overlay"><div><strong>Esperando jugador</strong><span>Ingresa tu ID desde el celular.</span></div></div>
<div id="ended" class="overlay hidden"><div><strong>Tiempo terminado</strong><span>La sesión finalizó.</span></div></div>
</div></section>
<aside class="card">
<div class="row"><span class="label">Sala</span><span id="room" class="value">—</span></div>
<div class="row"><span class="label">Jugador</span><span id="student" class="value">Sin sesión</span></div>
<div class="row"><span class="label">Tiempo restante</span><span id="timer" class="timer">01:00</span></div>
<div class="row"><span class="label">Último comando</span><span id="last" class="value">Ninguno</span></div>
<div class="row"><span class="label">Control móvil</span><a id="controlLink" href="#">—</a></div>
</aside>
</main>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,DEFAULT_ROOM}from"./config.js";
const p=new URLSearchParams(location.search),room=(p.get("room")||DEFAULT_ROOM).trim()||DEFAULT_ROOM;
const $=id=>document.getElementById(id),status=$("status"),student=$("student"),timer=$("timer"),last=$("last"),player=$("player"),waiting=$("waiting"),ended=$("ended");
$("room").textContent=room;const u=new URL("./control.html",location.href);u.searchParams.set("room",room);$("controlLink").href=u.href;$("controlLink").textContent=u.href;
let x=50,y=50,session=null,endAt=0,tickHandle=null;
function render(){player.style.left=x+"%";player.style.top=y+"%"}function move(d){if(!session||Date.now()>=endAt)return;if(d==="up")y=Math.max(4,y-4);if(d==="down")y=Math.min(96,y+4);if(d==="left")x=Math.max(4,x-4);if(d==="right")x=Math.min(96,x+4);if(d==="reset"){x=50;y=50}last.textContent=d.toUpperCase();render()}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function finish(){if(tickHandle)clearInterval(tickHandle);tickHandle=null;timer.textContent="00:00";endAt=0;ended.classList.remove("hidden");waiting.classList.add("hidden")}
function begin(q){session=q.session_id;student.textContent=q.student_id;endAt=new Date(q.control_ends_at).getTime();x=50;y=50;render();last.textContent="Ninguno";waiting.classList.add("hidden");ended.classList.add("hidden");if(tickHandle)clearInterval(tickHandle);const t=()=>{const r=(endAt-Date.now())/1000;timer.textContent=fmt(r);if(r<=0)finish()};t();tickHandle=setInterval(t,250)}
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const ch=supabase.channel("game:"+room,{config:{broadcast:{ack:true}}})
.on("broadcast",{event:"session_start"},({payload})=>{if(payload?.session_id)begin(payload)})
.on("broadcast",{event:"move"},({payload})=>{if(payload?.session_id===session&&payload?.direction)move(payload.direction)})
.on("broadcast",{event:"session_end"},({payload})=>{if(payload?.session_id===session)finish()})
.subscribe(s=>{if(s==="SUBSCRIBED"){status.classList.add("online");status.lastElementChild.textContent="Realtime conectado"}else status.lastElementChild.textContent=s.replaceAll("_"," ")});
render();
</script>
</body></html>
