<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Control Realtime</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111d;color:#eef6ff;font-family:Arial,sans-serif;padding:20px}
.card{width:min(100%,380px);padding:22px;border:1px solid #29445f;border-radius:24px;background:#0d1b2a}
h1{margin:0 0 8px}
#status{color:#9fb3c8;font-size:14px;margin-bottom:16px}
.room{padding:10px 12px;border:1px solid #21374c;border-radius:12px;margin-bottom:18px;background:#0a1724}
.dpad{display:grid;grid-template-columns:repeat(3,88px);grid-template-rows:repeat(3,88px);gap:8px;justify-content:center}
button{border:1px solid #2b4c67;border-radius:18px;background:#12304a;color:white;font-size:30px;font-weight:bold;touch-action:manipulation}
button:active{transform:scale(.95);background:#194d72}
.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.reset{grid-column:2;grid-row:2;font-size:11px}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}
#info{text-align:center;color:#9fb3c8;font-size:14px;margin-top:18px;min-height:20px}
</style>
</head>
<body>
<main class="card">
  <h1>Control móvil</h1>
  <div id="status">Conectando...</div>
  <div class="room"><strong>Sala:</strong> <span id="room"></span></div>
  <div class="dpad">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="reset" data-dir="reset">CENTRO</button>
    <button class="right" data-dir="right">→</button>
    <button class="down" data-dir="down">↓</button>
  </div>
  <div id="info">Esperando conexión...</div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, DEFAULT_ROOM } from "./config.js";

const params=new URLSearchParams(location.search);
const room=params.get("room")||DEFAULT_ROOM;
document.getElementById("room").textContent=room;

const statusEl=document.getElementById("status");
const info=document.getElementById("info");
const buttons=[...document.querySelectorAll("button")];

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const channel=supabase.channel("game:"+room,{config:{broadcast:{ack:true}}});

buttons.forEach(btn=>{
  btn.addEventListener("pointerdown",async e=>{
    e.preventDefault();
    const direction=btn.dataset.dir;
    const result=await channel.send({
      type:"broadcast",
      event:"move",
      payload:{direction}
    });
    info.textContent = result==="ok" ? "Enviado: "+direction : "Error al enviar";
  });
});

channel.subscribe((status)=>{
  statusEl.textContent = status==="SUBSCRIBED" ? "● Conectado" : status;
  info.textContent = status==="SUBSCRIBED" ? "Listo. Usa las flechas." : "Esperando conexión...";
});
</script>
</body>
</html>
